# Deploys the shared backend (chats, users, verification, balances).
#
# Storage is Postgres through DATABASE_URL (Supabase). The database — not the
# container filesystem — is what makes signups, chats and balances survive
# restarts and redeploys.
#
# `sync: false` keeps DATABASE_URL in the Render dashboard only: a Blueprint
# sync neither overwrites nor erases it, and the URI is never committed here.
# Set it under shieldsafebank-api → Environment → Environment Variables.
#
# Without DATABASE_URL the service falls back to DATA_DIR/store.json, which the
# free plan does not persist (no mounted disk), so data would reset on restart.
services:
  - type: web
    name: shieldsafebank-api
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DATA_DIR
        value: /var/data
    healthCheckPath: /api/health
