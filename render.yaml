# Deploys the shared backend (chats, users, verification, balances).
#
# Free tier: works immediately, but data resets on restart/redeploy (no disk).
# For production persistence upgrade the instance to Starter and add a disk
# mounted at /var/data with DATA_DIR=/var/data in the Render dashboard.
services:
  - type: web
    name: shieldsafebank-api
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DATA_DIR
        value: /var/data
    healthCheckPath: /api/health
