# Deploys the shared backend (chats, users, verification, balances).
#
# Render free instances do not keep a persistent disk, so for production use a
# paid instance (Starter) so `store.json` survives restarts and deploys.
services:
  - type: web
    name: shieldsafebank-api
    runtime: node
    rootDir: server
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    disk:
      name: shieldsafebank-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DATA_DIR
        value: /var/data
    healthCheckPath: /api/health
